[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-downloader"
version = "0.1.0"
description = "多源模型下载器 + 硬件自适应推荐 + 本地模型库"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["gguf", "llm", "llama.cpp", "model-downloader", "hf-mirror", "modelscope", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# CLI 完全零依赖；Web UI 走可选依赖（pip install "llm-downloader[web]"）
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.urls]
Homepage = "https://github.com/tinuslin/llm-downloader"
Repository = "https://github.com/tinuslin/llm-downloader"
Issues = "https://github.com/tinuslin/llm-downloader/issues"

[project.scripts]
llm-downloader = "llm_downloader.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["llm_downloader*"]

# Web UI 页面必须随 wheel / sdist 一起分发，否则 serve 会退化成占位页
[tool.setuptools.package-data]
"llm_downloader" = ["static/*.html"]
