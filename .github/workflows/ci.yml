name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: CLI py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile
        run: python -m compileall -q llm_downloader
      # -S disables site-packages: proves the CLI truly needs no third-party package
      - name: CLI smoke (stdlib only)
        run: |
          python -S -m llm_downloader --help
          python -S -m llm_downloader recommend --role tools
          python -S -m llm_downloader list
      - name: Launcher byte guard
        run: python .github/scripts/check_launchers.py

  package:
    name: Package + Web import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify Web UI asset is shipped
        run: python .github/scripts/check_package.py
      - name: Install with web extra and import ASGI app
        run: |
          python -m pip install ".[web]"
          python -c "from llm_downloader.web import app; print('routes:', len(app.routes))"
